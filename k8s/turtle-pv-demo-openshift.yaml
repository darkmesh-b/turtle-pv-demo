    <script>
    const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
    let garden=null,lastCount=null,lastStep=null,lastPod=null,received=0,lastSaved=0,serverAtReceipt=0,runtimeError=null,interval=1,ever=false;
    const text=(id,value)=>$(id).textContent=value;
    const timeText=value=>new Date(value*1000).toLocaleTimeString([], {hour12:false});
    function svg(tag, attrs, parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;}
    function draw(w){
     if(garden!==w.garden_id){garden=w.garden_id;$('walls').replaceChildren();w.grid.forEach((row,y)=>row.forEach((v,x)=>{if(v)svg('rect',{x:x*30+1,y:y*30+1,width:28,height:28,rx:5,fill:(x+y)%3===0?'#b3c69a':'#bfd0aa'},$('walls'));}));}
     $('trail').replaceChildren();w.trail.forEach(([x,y],i)=>svg('circle',{cx:x*30+15,cy:y*30+15,r:2.5,fill:'#c89866',opacity:.2+.65*i/w.trail.length},$('trail')));
     $('food').replaceChildren();w.lettuce.forEach(([x,y])=>svg('use',{href:'#lettuce-icon',x:x*30+3,y:y*30+3,width:24,height:24},$('food')));
     const [x,y]=w.position,angle={right:0,down:90,left:180,up:270}[w.direction];
     $('turtle').style.transform=`translate(${x*30+15}px,${y*30+15}px) rotate(${angle}deg)`;
     $('waiting').style.display='none';
    }
    function health(){
     const stale=!received || performance.now()-received>4000;
     const age=received?serverAtReceipt+(performance.now()-received)/1000-lastSaved:Infinity;
     const held=runtimeError || age>Math.max(5,interval*3);
     const ok=!stale&&!held;
     $('status').classList.toggle('off',!ok);
     text('status-text',stale?(ever?'Connection lost · last saved view':'Connecting to the garden'):held?'Waiting for a successful write':'Live · writing to storage');
     const message=stale&&ever?'The garden is disconnected. This is the last confirmed state; the turtle will reconnect automatically.':held&&!stale?'Writes are delayed or failing. The turtle is showing its last committed position; it will move again when storage is available.':'';
     $('notice').classList.toggle('show',!!message);text('notice',message);
     text('save-symbol',ok?'✓':'○');text('save-note',ok?'Committed before it appears here':stale?'Waiting to reconnect':'Waiting for the next commit');
    }
    function update(data){
     const w=data.world,r=data.runtime;
     received=performance.now();lastSaved=w.saved_at;serverAtReceipt=r.server_time;runtimeError=r.error;interval=r.interval;ever=true;
     draw(w);text('garden-id',`Garden ${w.garden_id} · ${w.grid[0].length} × ${w.grid.length}`);
     text('lettuces',w.collected.toLocaleString());text('steps',w.steps.toLocaleString());text('resumes',w.sessions-1);text('pod',r.pod);$('pod').title=`Node: ${r.node}`;text('pvc',r.pvc);text('saved',`${timeText(w.saved_at)} · step ${w.steps.toLocaleString()}`);text('timing',`${r.commit_ms.toFixed(1)} ms · ${(r.db_bytes/1024).toFixed(0)} KiB`);
     if(lastCount!==null&&w.collected>lastCount){$('lettuces').classList.remove('pulse');void $('lettuces').offsetWidth;$('lettuces').classList.add('pulse');}
     if(lastStep!==w.steps||lastPod!==r.pod){$('events').replaceChildren();data.events.slice(0,4).forEach(e=>{const row=document.createElement('div');row.className='event';const t=document.createElement('span');t.className='mono small';t.textContent=timeText(e.saved_at);const what=document.createElement('span');what.className='event-kind';const tick=document.createElement('span');tick.className='tick';tick.textContent=e.kind==='lettuce'?'✦':'✓';what.append(tick,document.createTextNode(e.kind==='lettuce'?`Lettuce collected · total ${e.lettuce}`:e.kind==='resume'?`Journey resumed at step ${e.step}`:e.kind==='start'?'A new garden planted':`Step ${e.step.toLocaleString()} committed`));what.title=e.pod;const pod=document.createElement('em');pod.textContent=e.kind==='resume'?'New session':'Saved to PVC';row.append(t,what,pod);$('events').append(row);});}
     lastCount=w.collected;lastStep=w.steps;lastPod=r.pod;health();
    }
    async function poll(){try{const response=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(3000)});if(!response.ok)throw Error('Storage unavailable');update(await response.json());}catch(e){if(!ever){text('status-text','Waiting for the garden');text('waiting','Waiting for persistent storage…');}health();}finally{setTimeout(poll,450);}}
    setInterval(health,1000);poll();
    </script>
    </body>
    </html>

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: turtle-data
  namespace: turtle-demo
spec:
  accessModes: [ReadWriteOnce]
  # Uncomment and set if there is no default StorageClass.
  # storageClassName: YOUR_STORAGE_CLASS
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: turtle
  namespace: turtle-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: turtle
  template:
    metadata:
      labels:
        app: turtle
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: turtle
          # Source is mounted from the ConfigMap. No custom image build required.
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: [python, /app/app.py]
          env:
            - name: DATA_DIR
              value: /data
            - name: PVC_NAME
              value: turtle-data
            - name: STEP_SECONDS
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: code
          configMap:
            name: turtle-app
        - name: data
          persistentVolumeClaim:
            claimName: turtle-data
---
apiVersion: v1
kind: Service
metadata:
  name: turtle
  namespace: turtle-demo
spec:
  selector:
    app: turtle
  ports:
    - port: 80
      targetPort: http
      name: http
  type: LoadBalancer
